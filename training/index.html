<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Training | Mitchell Ray</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#f4f1ea;--surface:#fff;--border:#d8d2c4;--rule:#1a1815;--text:#1a1815;--dim:#6f685b;--accent:#e8481c;--green:#1f7a52;
--font:'Inter',system-ui,sans-serif;--display:'Fraunces',Georgia,serif;--label:'Archivo','Helvetica Neue',Arial,sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);background-image:radial-gradient(var(--border) .5px,transparent .5px);background-size:22px 22px;color:var(--text);line-height:1.6}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--text)}
header{border-bottom:1px solid var(--rule);background:rgba(244,241,234,.9);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
header .in{max-width:1100px;margin:0 auto;padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--display);font-weight:700;color:var(--text)}.logo span{color:var(--accent)}
.back{font-family:var(--label);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
main{max-width:1100px;margin:0 auto;padding:3.5rem 1.5rem 4rem}
.label{font-family:var(--label);font-size:.72rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-top:3px solid var(--rule);padding-top:.6rem;margin-bottom:1rem}
.label b{color:var(--accent)}
h1{font-family:var(--display);font-size:clamp(2rem,5vw,3.2rem);font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-bottom:1rem}
.intro{color:var(--dim);max-width:680px;font-size:1.05rem;margin-bottom:1.5rem}
.progress{display:flex;align-items:center;gap:.8rem;font-family:var(--label);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2.5rem}
.bar{flex:0 0 200px;height:6px;background:var(--border)}.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.grid{display:grid;gap:1.25rem}
.card{background:var(--surface);border:1px solid var(--rule);padding:1.5rem}
.card.done{border-left:6px solid var(--green)}
.card .num{font-family:var(--label);font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.3rem}
.card h2{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.15;margin-bottom:.4rem}
.card .sub{color:var(--dim);margin-bottom:1rem}
.meta{font-size:.78rem;color:var(--dim);margin-bottom:1rem}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.btn{font:600 .8rem var(--font);padding:.55rem 1rem;border:1.5px solid var(--rule);background:transparent;color:var(--text);cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{background:var(--text);border-color:var(--text);color:var(--bg)}
.chk{margin-left:auto;font-size:.82rem;display:flex;gap:.4rem;align-items:center;cursor:pointer}
.obj{display:none;margin-top:1.1rem;padding-top:1rem;border-top:1px solid var(--border)}
.obj.open{display:block}
.obj h3{font-family:var(--label);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem}
.obj ul{padding-left:1.2rem;color:var(--dim);font-size:.95rem}
.viewer{display:none;margin-top:1.1rem}.viewer.open{display:block}
.viewer iframe{width:100%;height:80vh;border:1px solid var(--rule);background:#fff}
footer{text-align:center;padding:2rem;font-size:.8rem;color:var(--dim);border-top:1px solid var(--border)}
@media(max-width:620px){.chk{margin-left:0}.bar{flex-basis:120px}}
</style>
</head>
<body>
<header><div class="in"><a class="logo" href="../">Mitchell Ray<span>.</span></a><a class="back" href="../">&larr; Back to site</a></div></header>
<main>
  <div class="label"><b>&sect;</b> Training</div>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <div class="progress"><span id="ptext"></span><div class="bar"><i id="pbar"></i></div><a class="btn primary" id="cta" href="m1.html">Start Module 1</a></div>
  <div class="grid" id="grid"></div>
</main>
<footer>&copy; Mitchell Ray &middot; Training material</footer>
<script src="modules.js"></script>
<script>
const T = window.TRAINING, KEY = "training-done";
const done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("title").textContent = T.title;
document.getElementById("intro").textContent = T.intro;
document.title = T.title + " | Training";

function cta() {
  const nx = T.modules.find(m => !done.has(m.id)), a = document.getElementById("cta");
  a.href = nx ? `m${nx.id}.html` : "m1.html";
  a.textContent = !nx ? "Review from Module 1" : done.size ? `Continue: Module ${nx.id}` : "Start Module 1";
}
function render() {
  document.getElementById("grid").innerHTML = T.modules.map(m => `
    <article class="card ${done.has(m.id) ? "done" : ""}" data-id="${m.id}">
      <div class="num">Module ${m.id}</div>
      <h2>${esc(m.title)}</h2>
      <p class="sub">${esc(m.subtitle)}</p>
      <p class="meta">${m.objectives.length} learning objectives${m.pages ? " &middot; " + m.pages + " pages" : ""}</p>
      <div class="actions">
        <a class="btn primary" href="m${m.id}.html">${done.has(m.id) ? "Review lesson" : "Start lesson"}</a>
        <button class="btn" data-act="obj">Objectives</button>
        <a class="btn" href="${m.file}" download>Original PDF</a>
        <label class="chk"><input type="checkbox" data-act="done" ${done.has(m.id) ? "checked" : ""}> Completed</label>
      </div>
      <div class="obj"><h3>By the end of this module you can</h3><ul>${m.objectives.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>
    </article>`).join("");
  const n = done.size, t = T.modules.length;
  document.getElementById("ptext").textContent = `${n} of ${t} complete`;
  document.getElementById("pbar").style.width = (100 * n / t) + "%";
  cta();
}

document.getElementById("grid").addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const card = el.closest(".card"), id = +card.dataset.id, m = T.modules.find(x => x.id === id);
  if (el.dataset.act === "obj") card.querySelector(".obj").classList.toggle("open");
  if (el.dataset.act === "done") {
    el.checked ? done.add(id) : done.delete(id);
    localStorage.setItem(KEY, JSON.stringify([...done]));
    card.classList.toggle("done", el.checked);
    document.getElementById("ptext").textContent = `${done.size} of ${T.modules.length} complete`;
    document.getElementById("pbar").style.width = (100 * done.size / T.modules.length) + "%";
    cta();
  }
});
render();
</script>
</body>
</html>
